name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release (disable for build-only validation)
        type: boolean
        required: true
        default: true
env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch deps info
    runs-on: ubuntu-latest
    outputs:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release link
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
            group: aseprite
            repo: aseprite
            match: Aseprite-.*?-Source.zip

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite (Linux AppImage)
    needs: [fetch-aseprite-info, create-release]
    if: >-
      ${{ !cancelled() && needs.fetch-aseprite-info.result == 'success' &&
          (needs.create-release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && !inputs.publish &&
            needs.create-release.result == 'skipped')) }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev wget fuse
      - uses: actions/checkout@v7
      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.fetch-aseprite-info.outputs.release-tag }}
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip Skia-Linux-Release-x64.zip -d skia
      - uses: aseprite/get-ninja@main
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on
          export skia_arch=x64

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_I18N_STRINGS=ON \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'data' -prune \) -exec rm -rf {} +
      - name: Verify bundled translations
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          data_dir=data
          strings_dir="$data_dir/strings.git"

          translation_found=false
          for translation in "$strings_dir"/*.ini; do
            if [[ "${translation##*/}" != en.ini && -f "$translation" ]] &&
                grep -Eq '^[[:space:]]*\[[^]]+\]' "$translation"; then
              translation_found=true
              break
            fi
          done
          if [[ "$translation_found" != true ]]; then
            echo "No non-English translation content found in $strings_dir" >&2
            exit 1
          fi

          rm -rf "$strings_dir/.git"
      - name: Create AppImage Package
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          # 1. Create AppDir directory structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          
          # 2. Copy binary and data files into usr/bin
          cp -r * AppDir/usr/bin/
          
          # 3. Create desktop entry file
          cat << 'EOF' > AppDir/aseprite.desktop
          [Desktop Entry]
          Name=Aseprite
          Exec=aseprite
          Icon=aseprite
          Type=Application
          Categories=Graphics;2DGraphics;
          EOF
          cp AppDir/aseprite.desktop AppDir/usr/share/applications/
          
          # 4. Copy app icon if present
          if [ -f "data/icons/aseprite_256.png" ]; then
            cp data/icons/aseprite_256.png AppDir/usr/share/icons/hicolor/256x256/apps/aseprite.png
            cp data/icons/aseprite_256.png AppDir/aseprite.png
          fi

          # 5. Create AppRun entry script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/aseprite" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # 6. Download appimagetool and compile AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          APP_NAME="Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-Linux-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "$APP_NAME"
      - name: Upload validation artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-Linux-AppImage
          path: aseprite/build/bin/*.AppImage
          if-no-files-found: error
          compression-level: 0
      - name: Upload release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-Linux-x86_64.AppImage
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-Linux-x86_64.AppImage
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
